# A generic, single database configuration for Alembic.

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration file names; The default value is --rev-id
# file_template = %%(rev)s_%%(slug)s

# Prepend sys.path with backend folder
prepend_sys_path = .

# Timezone to use when rendering the date within the migration file
# timezone = UTC

# Max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command, regardless of autogenerate
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# Version location specification; This defaults
# to alembic/versions.  When using multiple version
# directories, initial revisions must be specified with --version-path.
version_locations = alembic/versions

# The output encoding used when revisions are generated
output_encoding = utf-8

# sqlalchemy.url is dynamically populated from app.core.config.settings.DATABASE_URL in alembic/env.py
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/adeip_db


[post_write_hooks]
# Post-write hooks define scripts or Python methods that are run on newly
# generated revision scripts.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
